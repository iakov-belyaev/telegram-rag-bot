# Tool configuration only (no packaging). Requirements in requirements*.txt.

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "state", "logs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",    # long lines tolerated (log strings, prompts)
    "B008",    # function calls in default args (FastAPI Depends pattern)
    "E722",    # bare except used deliberately in guards
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E702", "F401", "F811"]   # tests are plain scripts: cross-module patches, compact bodies

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_strict_optional = true
warn_unused_ignores = false
exclude = '(\.venv|state|logs|tests)/'

[tool.pytest.ini_options]
# Tests are plain scripts run via tests/run_all.py; pytest collects nothing here.
testpaths = []
